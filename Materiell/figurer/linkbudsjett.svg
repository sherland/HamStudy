<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="270" viewBox="0 0 1050 270" role="img" aria-labelledby="t d"><title id="t">Linkbudsjett</title><desc id="d">Sendereffekt pluss antennegain minus kabel- og banetap gir mottatt effekt.</desc><defs><marker id="a" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 Z" fill="#263238"/></marker></defs><style>text{font:16px sans-serif;fill:#17202a}.gain{fill:#e9f4ea;stroke:#28723b;stroke-width:2}.loss{fill:#fde9e5;stroke:#b33b24;stroke-width:2}.power{fill:#e8f2f8;stroke:#1665a7;stroke-width:2}.l{stroke:#263238;stroke-width:2;marker-end:url(#a)}</style><rect class="power" x="25" y="80" width="130" height="80"/><text x="48" y="112">Sender</text><text x="47" y="137">Pt dBm</text><line class="l" x1="155" y1="120" x2="190" y2="120"/><rect class="loss" x="195" y="80" width="125" height="80"/><text x="215" y="112">− TX-kabel</text><text x="243" y="137">Ltx</text><line class="l" x1="320" y1="120" x2="355" y2="120"/><rect class="gain" x="360" y="80" width="120" height="80"/><text x="382" y="112">+ TX-gain</text><text x="405" y="137">Gtx</text><line class="l" x1="480" y1="120" x2="515" y2="120"/><rect class="loss" x="520" y="80" width="130" height="80"/><text x="541" y="112">− banetap</text><text x="558" y="137">Lpath</text><line class="l" x1="650" y1="120" x2="685" y2="120"/><rect class="gain" x="690" y="80" width="120" height="80"/><text x="712" y="112">+ RX-gain</text><text x="735" y="137">Grx</text><line class="l" x1="810" y1="120" x2="845" y2="120"/><rect class="loss" x="850" y="80" width="115" height="80"/><text x="866" y="112">− RX-tap</text><text x="892" y="137">Lrx</text><line class="l" x1="965" y1="120" x2="1000" y2="120"/><text x="1005" y="112">Pr</text><text x="1000" y="137">dBm</text><text x="300" y="225">dBm er absoluttnivå; gain og tap er dB-forhold som summeres algebraisk.</text></svg>
