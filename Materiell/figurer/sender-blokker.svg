  <rect class="b" x="470" y="65" width="125" height="70"/><text x="493" y="95">SSB-filter</text><text x="487" y="117">eller DSP</text><line class="l" x1="595" y1="100" x2="635" y2="100"/>
  <rect class="m" x="640" y="65" width="100" height="70"/><text x="663" y="106">Mikser</text><line class="l" x1="740" y1="100" x2="780" y2="100"/>
  <rect class="b" x="785" y="65" width="125" height="70"/><text x="815" y="95">Lineær</text><text x="802" y="117">driver/PA</text><line class="l" x1="910" y1="100" x2="950" y2="100"/>
  <rect class="b" x="955" y="65" width="120" height="70"/><text x="978" y="95">Utgangs-</text><text x="989" y="117">filter</text>
  <text x="20" y="245">FM</text><text x="20" y="315">Mik.</text><line class="l" x1="60" y1="310" x2="125" y2="310"/>
  <rect class="b" x="130" y="275" width="150" height="70"/><text x="150" y="305">Audiofilter/</text><text x="162" y="327">nivåkontroll</text><line class="l" x1="280" y1="310" x2="340" y2="310"/>
