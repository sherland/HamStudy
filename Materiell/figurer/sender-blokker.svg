  <rect class="b" x="575" y="275" width="150" height="70"/><text x="601" y="305">Buffer/driver</text><text x="624" y="327">/ PA</text><line class="l" x1="725" y1="310" x2="800" y2="310"/>
  <rect class="b" x="805" y="275" width="150" height="70"/><text x="833" y="305">Tilpasning</text><text x="847" y="327">og filter</text><line class="l" x1="955" y1="310" x2="1030" y2="310"/><text x="1035" y="315">Antenne</text>
