<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="420" viewBox="0 0 1100 420" role="img" aria-labelledby="title desc">
  <title id="title">SSB- og FM-sender</title><desc id="desc">Forenklede blokker fra mikrofon til antenne for en SSB-sender og en PLL-basert FM-sender.</desc>
