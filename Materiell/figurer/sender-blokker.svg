  <style>text{font:16px sans-serif;fill:#17202a}.b{fill:#e9f4ea;stroke:#28723b;stroke-width:2}.m{fill:#fff1dc;stroke:#a45a16;stroke-width:2}.l{stroke:#263238;stroke-width:2;marker-end:url(#a)}</style>
  <text x="20" y="35">SSB</text><text x="20" y="105">Mik.</text><line class="l" x1="60" y1="100" x2="105" y2="100"/>
  <rect class="b" x="110" y="65" width="125" height="70"/><text x="135" y="95">Audiofor-</text><text x="138" y="117">sterker</text><line class="l" x1="235" y1="100" x2="275" y2="100"/>
