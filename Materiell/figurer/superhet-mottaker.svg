<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="340" viewBox="0 0 1100 340" role="img" aria-labelledby="title desc">
  <title id="title">Superheterodynmottaker</title><desc id="desc">Signalet går fra antenne gjennom inngangsfilter, RF-forsterker, mikser, IF-filter og forsterker, detektor og audio. Lokaloscillator går til mikseren.</desc>
  <defs><marker id="a" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 Z" fill="#263238"/></marker></defs>
  <style>text{font:16px sans-serif;fill:#17202a}.b{fill:#e8f2f8;stroke:#1665a7;stroke-width:2}.s{fill:#fff1dc;stroke:#a45a16;stroke-width:2}.l{stroke:#263238;stroke-width:2;marker-end:url(#a)}</style>
  <text x="20" y="42">Antenne</text><line class="l" x1="75" y1="100" x2="125" y2="100"/>
  <rect class="b" x="130" y="65" width="130" height="70"/><text x="151" y="95">Inngangs-</text><text x="169" y="117">filter</text>
  <line class="l" x1="260" y1="100" x2="305" y2="100"/><rect class="b" x="310" y="65" width="125" height="70"/><text x="335" y="95">RF-for-</text><text x="337" y="117">sterker</text>
  <line class="l" x1="435" y1="100" x2="480" y2="100"/><rect class="s" x="485" y="65" width="100" height="70"/><text x="508" y="106">Mikser</text>
  <line class="l" x1="585" y1="100" x2="630" y2="100"/><rect class="b" x="635" y="65" width="140" height="70"/><text x="660" y="95">IF-filter/</text><text x="653" y="117">forsterker</text>
  <line class="l" x1="775" y1="100" x2="820" y2="100"/><rect class="b" x="825" y="65" width="110" height="70"/><text x="846" y="106">Detektor</text>
  <line class="l" x1="935" y1="100" x2="980" y2="100"/><text x="987" y="95">Audio</text>
  <rect class="s" x="450" y="220" width="170" height="65"/><text x="470" y="248">Lokaloscillator</text><text x="502" y="270">/ PLL</text><line class="l" x1="535" y1="220" x2="535" y2="140"/>
  <path d="M760 140 V190 H370 V140" fill="none" class="l"/><text x="492" y="185">AGC</text>
</svg>
