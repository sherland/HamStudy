<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400" role="img" aria-labelledby="t d"><title id="t">Tid- og frekvensdomene</title><desc id="d">Oscilloskop viser spenning mot tid; spektrumanalysator viser nivå mot frekvens for samme signal.</desc><style>text{font:17px sans-serif;fill:#17202a}.axis{stroke:#222;stroke-width:2}.wave{fill:none;stroke:#1665a7;stroke-width:4}.bar{stroke:#b33b24;stroke-width:9}</style><text x="80" y="35">Oscilloskop: U(t)</text><line class="axis" x1="70" y1="180" x2="450" y2="180"/><line class="axis" x1="70" y1="55" x2="70" y2="305"/><path class="wave" d="M70 180 C100 65 130 65 160 180 S220 295 250 180 S310 65 340 180 S400 295 430 180"/><text x="425" y="210">tid</text><text x="35" y="70">U</text><text x="600" y="35">Spektrumanalysator: nivå(f)</text><line class="axis" x1="570" y1="305" x2="950" y2="305"/><line class="axis" x1="570" y1="55" x2="570" y2="305"/><line class="bar" x1="690" y1="305" x2="690" y2="105"/><line class="bar" x1="790" y1="305" x2="790" y2="245"/><line class="bar" x1="890" y1="305" x2="890" y2="275"/><text x="675" y="335">f</text><text x="775" y="335">2f</text><text x="875" y="335">3f</text><text x="535" y="70">dB</text><text x="125" y="365">Bølgeform, periode, topp og fase</text><text x="655" y="365">Bærebærer, sidebånd og harmoniske</text></svg>
