<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" role="img" aria-labelledby="t d"><title id="t">Forenklede radiobølgebaner</title><desc id="d">Jordbølge følger bakken, rombølge går direkte og reflektert, himmelbølge brytes i ionosfæren.</desc><style>text{font:17px sans-serif;fill:#17202a}.earth{fill:#d9c49a;stroke:#695b3f;stroke-width:3}.iono{fill:none;stroke:#6b3fa0;stroke-width:28;opacity:.25}.ground{fill:none;stroke:#28723b;stroke-width:5}.space{fill:none;stroke:#1665a7;stroke-width:4}.sky{fill:none;stroke:#b33b24;stroke-width:5}.tower{stroke:#222;stroke-width:5}</style><path class="earth" d="M30 370 Q500 270 970 370 L970 430 L30 430 Z"/><path class="iono" d="M60 130 Q500 25 940 130"/><line class="tower" x1="130" y1="345" x2="130" y2="260"/><line class="tower" x1="870" y1="345" x2="870" y2="260"/><path class="ground" d="M130 337 Q500 280 870 337"/><path class="space" d="M130 270 L870 270"/><path class="space" d="M130 270 L500 330 L870 270" opacity=".6"/><path class="sky" d="M130 270 Q500 35 870 270"/><text x="420" y="55">ionosfære</text><text x="420" y="170" fill="#b33b24">himmelbølge</text><text x="420" y="255" fill="#1665a7">direkte rombølge</text><text x="420" y="365" fill="#28723b">jord-/overflatebølge</text></svg>
